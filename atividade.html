<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Exercícios JS</title>

    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }

        h1{
            text-align: center;
        }

        .box{
            background: white;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        input{
            padding: 5px;
            margin: 5px;
        }

        button{
            padding: 8px 15px;
            cursor: pointer;
        }

    </style>

</head>
<body>

    <h1>Lista de Exercícios sobre Funções</h1>

    <!-- QUESTÃO 1 -->
    <div class="box">

        <h2>1) MAIOR_MENOR</h2>

        <input type="number" id="n1" placeholder="Número 1">
        <input type="number" id="n2" placeholder="Número 2">
        <input type="number" id="n3" placeholder="Número 3">
        <input type="number" id="n4" placeholder="Número 4">
        <input type="number" id="n5" placeholder="Número 5">

        <button onclick="executarMaiorMenor()">Verificar</button>

        <p id="res1"></p>

    </div>


    <!-- QUESTÃO 2 -->
    <div class="box">

        <h2>2) VOGAL</h2>

        <input type="text" id="letra" maxlength="1">

        <button onclick="executarVogal()">Verificar</button>

        <p id="res2"></p>

    </div>


    <!-- QUESTÃO 3 -->
    <div class="box">

        <h2>3) LIMITES</h2>

        <input type="number" id="li" placeholder="Limite inferior">
        <input type="number" id="ls" placeholder="Limite superior">

        <button onclick="executarLimites()">Mostrar</button>

        <p id="res3"></p>

    </div>


    <!-- QUESTÃO 4 -->
    <div class="box">

        <h2>4) ORDEM</h2>

        <input type="number" id="o1">
        <input type="number" id="o2">
        <input type="number" id="o3">

        <button onclick="executarOrdem()">Ordenar</button>

        <p id="res4"></p>

    </div>


    <!-- QUESTÃO 5 -->
    <div class="box">

        <h2>5) POSITIVO_NEGATIVO</h2>

        <input type="number" id="pn">

        <button onclick="executarPositivoNegativo()">Verificar</button>

        <p id="res5"></p>

    </div>


    <!-- QUESTÃO 6 -->
    <div class="box">

        <h2>6) PAR_IMPAR</h2>

        <input type="number" id="pi">

        <button onclick="executarParImpar()">Verificar</button>

        <p id="res6"></p>

    </div>
</body>
    <script src="script.js"></script>
</html>
