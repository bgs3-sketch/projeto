<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Seu Currículo Virtual</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

    <button id="btnModoEscuro" type="button" onclick="alternarModoEscuro()">
        🌙
    </button>

    <h1>Seu Currículo Virtual</h1>

    <section>
        <h2>Formulário</h2>
        <form onsubmit="gerarCurriculo(event)">
            <div class="linha">
                <div class="campo">
                    <label>Nome:</label>
                    <input type="text" id="nome" required>
                </div>

                <div class="campo">
                    <label>Email:</label>
                    <input type="email" id="email" required>
                </div>

                <div class="campo">
                    <label>Telefone:</label>
                    <input type="tel" id="telefone" required>
                </div>
            </div>

            <div class="campo">
                <label>Formações:</label>
                <textarea id="formacoes" rows="4"></textarea>
            </div>

            <div class="campo">
                <label>Experiência:</label>
                <textarea id="experiencia" rows="4"></textarea>
            </div>

            <div class="campo">
                <label>Habilidades:</label>
                <textarea id="habilidades" rows="4"></textarea>
            </div>

            <button class="btn-gerar" type="submit">
                Gerar Currículo
            </button>
        </form>
    </section>

    <section id="curriculo">
       <h2>Currículo</h2>
       <div id="conteudo-curriculo">
            <h3 id="nomeCurriculo">Seu Nome Aqui</h3>
            
            <p><strong>Email:</strong> <span id="emailCurriculo"></span></p>
            <p><strong>Telefone:</strong> <span id="telefoneCurriculo"></span></p>

            <h4>Formações</h4>
            <p id="formacoesCurriculo"></p>

            <h4>Experiência</h4>
            <p id="experienciaCurriculo"></p>

            <h4>Habilidades</h4>
            <p id="habilidadesCurriculo"></p>
        </div>
        <button id="btnBaixarPDF" onclick="baixarPDF()">Baixar em PDF</button>
    </section>

    <script src="script.js"></script>
</body>
</html>
